<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1404" />
      <stop offset="100%" stop-color="#080706" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="45%" stop-color="#E8B820" />
      <stop offset="80%" stop-color="#C8900A" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ambient gold halo -->
  <circle cx="64" cy="64" r="38" fill="#E8B820" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Outer diamond -->
  <polygon points="64,20 108,64 64,108 20,64" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.75" />
  
  <!-- Rotated square -->
  <rect x="39" y="39" width="50" height="50" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Lotus Petals (Kolam) -->
  <path d="M64,64 C76,50 76,28 64,22 C52,28 52,50 64,64 Z" fill="url(#gold)" fill-opacity="0.25" stroke="url(#gold)" stroke-width="1.8" />
  <path d="M64,64 C76,78 76,100 64,106 C52,100 52,78 64,64 Z" fill="url(#gold)" fill-opacity="0.25" stroke="url(#gold)" stroke-width="1.8" />
  <path d="M64,64 C50,76 28,76 22,64 C28,52 50,52 64,64 Z" fill="url(#gold)" fill-opacity="0.25" stroke="url(#gold)" stroke-width="1.8" />
  <path d="M64,64 C78,76 100,76 106,64 C100,52 78,52 64,64 Z" fill="url(#gold)" fill-opacity="0.25" stroke="url(#gold)" stroke-width="1.8" />

  <!-- Corner dots -->
  <circle cx="64" cy="20" r="3" fill="url(#gold)" />
  <circle cx="108" cy="64" r="3" fill="url(#gold)" />
  <circle cx="64" cy="108" r="3" fill="url(#gold)" />
  <circle cx="20" cy="64" r="3" fill="url(#gold)" />

  <!-- Center Golden Jewel -->
  <circle cx="64" cy="64" r="7" fill="url(#gold)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="3" fill="#FFF5D0" />
</svg>
